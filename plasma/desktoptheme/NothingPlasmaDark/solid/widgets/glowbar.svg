<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Highlight { color: #3daee9; }
    </style>
  </defs>

  <!--
    Nothing edge hint: a 1 px accent core with a short three-step halo.
    The center stays nearly transparent so Plasma's stretched frame reads as
    light rather than as a solid coloured strip.
  -->
  <g class="ColorScheme-Highlight" fill="currentColor">
    <g id="top">
      <rect x="8" y="0" width="16" height="8" fill-opacity="0"/>
      <rect x="8" y="4" width="16" height="4" fill-opacity="0.035"/>
      <rect x="8" y="5" width="16" height="3" fill-opacity="0.075"/>
      <rect x="8" y="6" width="16" height="2" fill-opacity="0.16"/>
      <rect x="8" y="7" width="16" height="1" fill-opacity="0.62"/>
    </g>
    <g id="bottom">
      <rect x="8" y="24" width="16" height="8" fill-opacity="0"/>
      <rect x="8" y="24" width="16" height="4" fill-opacity="0.035"/>
      <rect x="8" y="24" width="16" height="3" fill-opacity="0.075"/>
      <rect x="8" y="24" width="16" height="2" fill-opacity="0.16"/>
      <rect x="8" y="24" width="16" height="1" fill-opacity="0.62"/>
    </g>
    <g id="left">
      <rect x="0" y="8" width="8" height="16" fill-opacity="0"/>
      <rect x="4" y="8" width="4" height="16" fill-opacity="0.035"/>
      <rect x="5" y="8" width="3" height="16" fill-opacity="0.075"/>
      <rect x="6" y="8" width="2" height="16" fill-opacity="0.16"/>
      <rect x="7" y="8" width="1" height="16" fill-opacity="0.62"/>
    </g>
    <g id="right">
      <rect x="24" y="8" width="8" height="16" fill-opacity="0"/>
      <rect x="24" y="8" width="4" height="16" fill-opacity="0.035"/>
      <rect x="24" y="8" width="3" height="16" fill-opacity="0.075"/>
      <rect x="24" y="8" width="2" height="16" fill-opacity="0.16"/>
      <rect x="24" y="8" width="1" height="16" fill-opacity="0.62"/>
    </g>

    <g id="topleft">
      <rect x="0" y="0" width="8" height="8" fill-opacity="0"/>
      <rect x="4" y="4" width="4" height="4" fill-opacity="0.035"/>
      <rect x="5" y="5" width="3" height="3" fill-opacity="0.075"/>
      <rect x="6" y="6" width="2" height="2" fill-opacity="0.16"/>
      <rect x="7" y="7" width="1" height="1" fill-opacity="0.62"/>
    </g>
    <g id="topright">
      <rect x="24" y="0" width="8" height="8" fill-opacity="0"/>
      <rect x="24" y="4" width="4" height="4" fill-opacity="0.035"/>
      <rect x="24" y="5" width="3" height="3" fill-opacity="0.075"/>
      <rect x="24" y="6" width="2" height="2" fill-opacity="0.16"/>
      <rect x="24" y="7" width="1" height="1" fill-opacity="0.62"/>
    </g>
    <g id="bottomleft">
      <rect x="0" y="24" width="8" height="8" fill-opacity="0"/>
      <rect x="4" y="24" width="4" height="4" fill-opacity="0.035"/>
      <rect x="5" y="24" width="3" height="3" fill-opacity="0.075"/>
      <rect x="6" y="24" width="2" height="2" fill-opacity="0.16"/>
      <rect x="7" y="24" width="1" height="1" fill-opacity="0.62"/>
    </g>
    <g id="bottomright">
      <rect x="24" y="24" width="8" height="8" fill-opacity="0"/>
      <rect x="24" y="24" width="4" height="4" fill-opacity="0.035"/>
      <rect x="24" y="24" width="3" height="3" fill-opacity="0.075"/>
      <rect x="24" y="24" width="2" height="2" fill-opacity="0.16"/>
      <rect x="24" y="24" width="1" height="1" fill-opacity="0.62"/>
    </g>

    <rect id="center" x="8" y="8" width="16" height="16" fill-opacity="0.018"/>
  </g>

  <g fill="#ff00ff" fill-opacity="0">
    <rect id="hint-left-margin" x="7" y="15" width="1" height="2"/>
    <rect id="hint-right-margin" x="24" y="15" width="1" height="2"/>
    <rect id="hint-top-margin" x="15" y="7" width="2" height="1"/>
    <rect id="hint-bottom-margin" x="15" y="24" width="2" height="1"/>
  </g>
</svg>
